<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bible</title>
    <style>
        .appContainer{
            display: flex;
        }

       ul{
            padding: 0;
            list-style: none;
       }

       .appContainer,
       .header{
         max-width: 1260px;
         margin-left: auto;
         margin-right: auto;
         overflow: hidden;
       }

       .caps__list{
         display: flex;
         gap: 16px;
         flex-wrap: wrap;
         width: 98%;
       }

       .caps__items{
         width: 40px; 
         height: 40px; 
         border: 1px solid black;
         display: grid;
         place-content: center;
         padding: 5px;
         font-size: 20px;
       }

       #prevBtn,
       #nextBtn{
         border: 0;
         width: 40px;
         height: 40px;
         box-shadow: 0 0 0 1px #d3d3d3d3;
         border-radius: 50%;
       }

       .btn-bible{
            /* background-color: red; */
            width: 90%;
            position: fixed;
            top: 95%;
            left: 50%;
            /* bottom: 0%; */
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: space-between;
       }

       .list{
        background-color: white;
        margin: 0;
        padding: 5px 0;
        display: inline-block;
        max-height: 100vh;
        overflow-y: auto;
       }

       .list-hidden{
        display: none;
       }

       .header{
            display: flex;
            align-items: center;
            gap: 30px;
            margin-top: 15px;
       }

       .title{
            margin: 0;
            font-size: 1.5rem;
            color: #628FA6;
       }

       .menu-btn{
            border: 0;
            background: none;
       }

       .overlay-active{
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background-color: rgba(245, 245, 247, .9);;
        z-index: 10;
       }

       .list li{
            padding: 10px; 
            border-bottom:1px solid #4444;
       }

       #currentCap{
        margin-top: 20px;
        overflow: auto;
        width: 98vw;
        display: flex;
        gap: 10px;
        position: sticky;
        top: 0;
        background-color: white;
        border-bottom: 2px solid #D9E4DD;
        padding-bottom: 3px;
       }

       #currentCap span {
        white-space: nowrap;
       }

       #currentCap,
       .list,
       .title{
        font-family: math
       }
       

       #currentCap span{
        padding: 10px;
       }

       .text,
       .verse__text{
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
       }

       .text,
       .verse__text,
       .itemsNav{
        color: #333333;
       }

       .text{
        margin: 0;
       }


       .bold{
        font-weight: bold;
        font-size: 17px;
       }
       
       .select-cap{
        font-weight: bold;
        background-color: #C9A66B;
        color: white;
       }

       .select-cap,
       .verse{
        border-radius: 3px;
       }
       
       .verse{
        padding: 10px;
        box-sizing: border-box;
        margin: 0 auto;
        width: 90%;
        background-color: #D9E4DD;
       }
    </style>
</head>
<body>
   <header class="header">
       <button class="menu-btn">
            <img src="icons/bars.svg" alt="" width="20">
       </button>
        <h1 class="title">Biblia</h1>
   </header>
    <div class="appContainer">
        
        <div class="appContainer__left">
            
            <ul class="list list-hidden">
               
            </ul>
            <div class="overlay">

            </div>
            
        </div>
        <main class="appContainer__right">
            <nav id="currentCap"></nav>
            <div class="containerText">
                <div class="caps">
                    <ul class="caps__list">
                        
                    </ul>
                </div>
                <div class="home">
                    <div class="verse">
                        <h2 class="verse__title">Versículo del día</h2>
                        <p class="verse__text">Jerusalen, Jerusanlen; cuantas veces trate de juntar a tus hijos como las gallinas juntan a los polluelos bajo sus alas, de cierto os digo que no me vereis hasta que digais: bendito sea el que viene en nombre del Señor</p>
                        <span class="verse__cite bold">Mateo 23:17</span>
                    </div>
                </div>
                
            </div>
        </main>
    </div>
    <script src="js/scripts.js"></script>
</body>
</html>
